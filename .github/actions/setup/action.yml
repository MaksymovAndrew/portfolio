name: Setup
description: Set up Node from .nvmrc with the npm cache and install the dependencies

runs:
    using: composite
    steps:
        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version-file: .nvmrc
              cache: npm
        - name: Install dependencies
          run: npm ci
          shell: bash
          env:
              HUSKY: "0"
