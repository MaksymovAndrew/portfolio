# weekly dependency updates; minor and patch bumps arrive as one grouped pull request,
# majors stay separate
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
          include: scope
      groups:
          minor-and-patch:
              update-types:
                  - minor
                  - patch
      ignore:
          # typescript-eslint 8.71 peers on typescript <6.1.0 (checked 2026-10-05),
          # so TypeScript 7 would cost every type-aware lint rule
          - dependency-name: "typescript"
            update-types: ["version-update:semver-major"]
          # the types follow the Node runtime in .nvmrc, not the newest Node;
          # bump them together with the runtime
          - dependency-name: "@types/node"
            update-types: ["version-update:semver-major"]
          # ESLint 10 waits for eslint-plugin-jsx-a11y 6.10 and eslint-plugin-import 2.32:
          # both peer on ESLint 9 at most (checked 2026-10-05)
          - dependency-name: "eslint"
            update-types: ["version-update:semver-major"]
          - dependency-name: "@eslint/js"
            update-types: ["version-update:semver-major"]

    # actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment together
    - package-ecosystem: github-actions
      directories:
          - "/"
          - "/.github/actions/setup"
      schedule:
          interval: weekly
      commit-message:
          prefix: chore
          include: scope
      groups:
          actions:
              patterns: ["*"]
